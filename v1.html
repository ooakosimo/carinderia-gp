<!DOCTYPE html>

<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   CARINDERIA GRAND PRIX  ·  v1
   Single-file vanilla JS + three.js r128 (cdnjs). No build step.
   ---------------------------------------------------------------------
   Layout of this file
     1. CONFIG          – tweak numbers here; FEATURES + ANCHORS are the
                          hooks for later versions
     2. utils / noise
     3. renderer, scene, quality presets
     4. TRACK           – spline, frames (incl. loop-the-loop), pit lane
     5. geometry helpers (ribbons, merged parts, instancing batches)
     6. textures
     7. WORLD           – sky, terrain, sea, road, city / coast / mountain
     8. CAR + ghost
     9. input, audio
    10. physics + lap logic
    11. cameras, HUD, main loop
   ===================================================================== */
(function () {
'use strict';
if (typeof THREE === 'undefined') {
  document.getElementById('goText').textContent = 'three.js failed to load (internet needed for cdnjs).';
  return;
}

/* ===================================================================
   1. CONFIG
   =================================================================== */
const CONFIG = {
  version: '1.0.0',
  seed: 1977,

  // Arcade car. The car rides "on rails" (distance along the track + lateral
  // offset), so it can never fall off – including inside the loop-the-loop.
  car: {
    maxSpeed: 62,        // m/s  (~223 km/h)
    accel: 26,
    brake: 52,
    coastDrag: 5,
    steerForce: 21,      // lateral accel at full lock
    grip: 2.4,           // lateral damping; LOWER = more drift
    cornerPush: 0.55,    // how hard corners fling you outward
    boostSpeed: 82,
    // Paint job – the future paint-shop generator will just write into this.
    paint: { body: '#ff3d9a', accent: '#ffe14a', trim: '#ffffff', glass: '#9ff3ff', underglow: '#35e6ff', wheels: '#1b1b2a' }
  },

  track: {
    halfWidth: 9,        // road half width (m)
    sampleSpacing: 2,    // metres between centre-line samples
    wallHeight: 0.9
  },

  // Pit lane: an extra lane on the right of the start straight, tapering in/out.
  pit: { width: 8, samplesBefore: 85, samplesAfter: 55, taperSamples: 28 },

  // Speed Racer loop. Cars are held at >= minSpeed inside it ("magic grip").
  loop: { radius: 34, shift: 26, minSpeed: 34 },

  // Quality presets. `density` scales optional props (instances), others are self-explanatory.
  quality: {
    low:  { pr: 1.0,  density: 0.30, fog: 0.0019, spot: false, lights: false, waves: false, stars: 150, smoke: 18, shake: 0.5 },
    med:  { pr: 1.5,  density: 0.65, fog: 0.0014, spot: true,  lights: false, waves: false, stars: 350, smoke: 34, shake: 1 },
    high: { pr: 2.0,  density: 1.00, fog: 0.0011, spot: true,  lights: true,  waves: true,  stars: 700, smoke: 52, shake: 1 }
  },

  // Zone mood (fog / horizon colour is blended as you drive between zones)
  zones: [
    { name: 'city',     fog: '#35154f', neon: '#ff3fa0' },
    { name: 'coast',    fog: '#17375c', neon: '#35e6ff' },
    { name: 'mountain', fog: '#40203f', neon: '#ffb02e' }
  ],

  debugPlots: false // draw outlines of the reserved paddock plots (see ANCHORS)
};

/* ---- Future-version hooks ------------------------------------------
   Flip these on when the feature exists. Everything marked FUTURE in the
   code below reads from here.                                          */
const FEATURES = {
  pitStop: false,        // FUTURE: mini-game when the car stops inside the pit lane
  paddockDining: false,  // FUTURE: trackside fine-dining restaurant in the paddock
  paddockStores: false,  // FUTURE: paddock shops (parts, snacks, merch)
  paintShop: false       // FUTURE: paint generator – edit CONFIG.car.paint then call CGP.rebuildCar()
};
// Event bus for later versions: push functions into these arrays.
const HOOKS = { onLapComplete: [], onPitEnter: [], onPitExit: [], onFrame: [] };
// Filled in by buildTrack(): s positions (metres along the track) and
// lateral coordinates of places we have reserved for later versions.
const ANCHORS = {};

/* ===================================================================
   2. utils
   =================================================================== */
const V3 = THREE.Vector3, M4 = THREE.Matrix4, Q4 = THREE.Quaternion, C = THREE.Color;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RNG = mulberry(CONFIG.seed);
const rand = (a = 0, b = 1) => a + (b - a) * RNG();
const pick = arr => arr[Math.floor(RNG() * arr.length)];
const hash2 = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
const CANDY = ['#ff4fa3', '#ffd23f', '#3fe0d0', '#7a5cff', '#ff7a3d', '#5cff8f', '#ff3b3b', '#4fb4ff'];
const Y_AXIS = new V3(0, 1, 0);
const isTouch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
const $ = id => document.getElementById(id);
const fmt = t => { if (t == null) return '--'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); };

/* ===================================================================
   3. renderer / scene
   =================================================================== */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setClearColor(0x07041a);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x35154f, 0.0014);
const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 6000);
scene.add(camera);

const MOON_DIR = new V3(0.8, 0.38, -0.35).normalize();
const hemi = new THREE.HemisphereLight(0x8a78ff, 0x3a1850, 0.95);
scene.add(hemi);
const moonLight = new THREE.DirectionalLight(0xaec4ff, 0.75);
moonLight.position.copy(MOON_DIR).multiplyScalar(100);
scene.add(moonLight);

const densityMeshes = [];   // InstancedMeshes whose count follows quality.density
let QNAME = isTouch ? 'med' : 'high', Q = CONFIG.quality[QNAME], autoQuality = true;

/* ===================================================================
   4. TRACK
   One closed Catmull-Rom loop. Control points are (x, z, y) with y up.
     city (night street) -> coast road -> mountain switchbacks -> loop-the-loop
     -> long descent back into the city.
   =================================================================== */
const TRK = {};
function buildTrack() {
  const pts = [], marks = {};
  const P = (x, z, y = 0, name) => { pts.push(new V3(x, y, z)); if (name) marks[name] = pts.length - 1; };

  // --- CITY (heading +x) ---
  P(-300, 0, 0, 'start0'); P(-150, 0); P(-20, 0); P(120, -4); P(230, -50); P(330, -60); P(420, -10, 0, 'cityEnd');
  // --- COAST (sea on the left) ---
  P(470, 80, .6); P(490, 190, .8); P(485, 300, .8); P(450, 400, .8); P(390, 480, .8); P(310, 540, .8); P(200, 585, 1); P(80, 605, 1.5, 'coastEnd');
  // --- MOUNTAIN: row 1 west, hairpin, row 2 east, hairpin, row 3 west ---
  P(-60, 602, 6); P(-190, 600, 14); P(-290, 603, 20);
  P(-340, 618, 23); P(-360, 655, 25); P(-340, 693, 27); P(-290, 708, 29);
  P(-200, 708, 31); P(-100, 708, 34); P(-20, 706, 37);
  P(30, 718, 38); P(55, 758, 40); P(30, 800, 42); P(-20, 812, 43);
  P(-80, 812, 44); P(-105, 812, 44);
  // --- LOOP-THE-LOOP: vertical circle with a smooth sideways shift so exit clears entry ---
  const R = CONFIG.loop.radius, SH = CONFIG.loop.shift, E = new V3(-130, 44, 812), NL = 28;
  marks.loopA = pts.length;
  for (let k = 0; k <= NL; k++) {
    const t = k / NL, th = t * Math.PI * 2, lat = SH * t * t * (3 - 2 * t);
    pts.push(new V3(E.x - R * Math.sin(th), E.y + R * (1 - Math.cos(th)), E.z + lat));
  }
  marks.loopB = pts.length - 1;
  P(-155, 838, 45); P(-190, 838, 45.5); P(-250, 838, 46); P(-340, 838, 47); P(-420, 825, 47);
  // --- DESCENT back to the city ---
  P(-470, 790, 46); P(-495, 725, 44); P(-505, 650, 40); P(-480, 560, 34); P(-445, 470, 28);
  P(-470, 380, 22); P(-500, 290, 16); P(-475, 200, 10); P(-430, 120, 6, 'desc'); P(-385, 55, 2.5);

  const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
  curve.arcLengthDivisions = 8000;
  const L = curve.getLength(), N = Math.round(L / CONFIG.track.sampleSpacing), ds = L / N;
  const Ps = []; for (let i = 0; i < N; i++) Ps.push(curve.getPointAt(i / N));
  const nearest = v => { let b = 0, bd = 1e18; for (let i = 0; i < N; i++) { const d = Ps[i].distanceToSquared(v); if (d < bd) { bd = d; b = i; } } return b; };

  // tangents + level "up"
  const T = [], U = [], Rr = [], K = new Float32Array(N), bank = new Float32Array(N);
  for (let i = 0; i < N; i++) T[i] = Ps[(i + 1) % N].clone().sub(Ps[(i - 1 + N) % N]).normalize();
  for (let i = 0; i < N; i++) U[i] = Y_AXIS.clone().addScaledVector(T[i], -T[i].y).normalize();

  // loop section: parallel-transport the up vector so the road can go upside-down,
  // then spread the residual twist so the exit matches the level frame.
  const iA = nearest(Ps[0].clone().copy(pts[marks.loopA])), iB = nearest(pts[marks.loopB]);
  const a0 = iA - 20, b0 = iB + 20;
  {
    const u = U[a0].clone(), Ut = [u.clone()];
    for (let i = a0 + 1; i <= b0; i++) {
      const axis = T[i - 1].clone().cross(T[i]), sn = axis.length();
      if (sn > 1e-8) { axis.divideScalar(sn); u.applyAxisAngle(axis, Math.atan2(sn, T[i - 1].dot(T[i]))); }
      Ut.push(u.clone());
    }
    const uf = Ut[Ut.length - 1], ul = U[b0];
    const phi = Math.atan2(uf.clone().cross(ul).dot(T[b0]), uf.dot(ul));
    for (let i = a0; i <= b0; i++) U[i] = Ut[i - a0].clone().applyAxisAngle(T[i], phi * (i - a0) / (b0 - a0));
  }
  for (let i = 0; i < N; i++) Rr[i] = T[i].clone().cross(U[i]).normalize();

  // lateral curvature (+ = turning right), lightly smoothed
  const k0 = new Float32Array(N);
  for (let i = 0; i < N; i++) k0[i] = T[(i + 1) % N].clone().sub(T[(i - 1 + N) % N]).dot(Rr[i]) / (2 * ds);
  for (let i = 0; i < N; i++) { let s = 0; for (let j = -4; j <= 4; j++) s += k0[(i + j + N) % N]; K[i] = s / 9; }

  // banking (visual) outside the loop, then smoothed
  const b1 = new Float32Array(N);
  for (let i = 0; i < N; i++) b1[i] = (i >= a0 - 10 && i <= b0 + 10) ? 0 : clamp(K[i] * 14, -0.17, 0.17);
  for (let i = 0; i < N; i++) { let s = 0; for (let j = -10; j <= 10; j++) s += b1[(i + j + N) % N]; bank[i] = s / 21; }
  for (let i = 0; i < N; i++) {
    const b = bank[i]; if (!b) continue;
    U[i].multiplyScalar(Math.cos(b)).addScaledVector(Rr[i], Math.sin(b)).normalize();
    Rr[i] = T[i].clone().cross(U[i]).normalize();
  }

  // zones by sample index
  const iCity1 = nearest(pts[marks.cityEnd]), iCoast1 = nearest(pts[marks.coastEnd]), iDesc = nearest(pts[marks.desc]);
  const zoneOf = i => i < iCity1 ? 0 : i < iCoast1 ? 1 : i < iDesc ? 2 : 0;

  // start / finish + pit lane
  const iLine = nearest(new V3(0, 0, 0)), sLine = iLine * ds;
  const pit = new Float32Array(N);
  const pA = iLine - CONFIG.pit.samplesBefore, pB = iLine + CONFIG.pit.samplesAfter, tp = CONFIG.pit.taperSamples;
  for (let i = pA; i <= pB; i++) pit[i] = CONFIG.pit.width * sstep(0, tp, i - pA) * sstep(0, tp, pB - i);

  // smoothed per-sample neon colour by zone
  const zc = CONFIG.zones.map(z => new C(z.neon)), zr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { let r = 0, g = 0, b = 0; for (let j = -40; j <= 40; j += 4) { const c = zc[zoneOf((i + j + N) % N)]; r += c.r; g += c.g; b += c.b; } zr[i * 3] = r / 21; zr[i * 3 + 1] = g / 21; zr[i * 3 + 2] = b / 21; }

  Object.assign(TRK, { pts, marks, L, N, ds, P: Ps, T, U, R: Rr, K, pit, iA, iB, iCity1, iCoast1, iDesc, zoneOf, iLine, sLine, neon: zr,
    hw: CONFIG.track.halfWidth, curve });

  // anchors for future features (pit stop, paddock buildings…)
  ANCHORS.startLine = { s: sLine };
  ANCHORS.pitLane = { sFrom: pA * ds, sTo: pB * ds, width: CONFIG.pit.width, side: 'right' };
  ANCHORS.paddock = { s: sLine - 20, latFrom: 32, latTo: 80, side: 'right', plots: {
    dining: { s: sLine - 70, lat: 55, size: [26, 18] },   // FUTURE: trackside fine-dining restaurant
    stores: { s: sLine + 10, lat: 55, size: [22, 14] }    // FUTURE: paddock stores
  } };
}
buildTrack();
const { L, N, ds, hw } = TRK;

const _fr = { P: new V3(), T: new V3(), U: new V3(), R: new V3(), K: 0, i: 0, pit: 0 };
function frameAt(s, out) {
  s = ((s % L) + L) % L;
  const f = s / ds, i0 = Math.floor(f), i = i0 % N, j = (i + 1) % N, t = f - i0;
  out.P.lerpVectors(TRK.P[i], TRK.P[j], t);
  out.T.lerpVectors(TRK.T[i], TRK.T[j], t).normalize();
  out.U.lerpVectors(TRK.U[i], TRK.U[j], t);
  out.U.addScaledVector(out.T, -out.U.dot(out.T)).normalize();
  out.R.crossVectors(out.T, out.U);
  out.K = lerp(TRK.K[i], TRK.K[j], t);
  out.pit = lerp(TRK.pit[i], TRK.pit[j], t);
  out.i = i;
  return out;
}
const zoneAtS = s => TRK.zoneOf(Math.floor((((s % L) + L) % L) / ds) % N);

/* ===================================================================
   5. geometry helpers
   =================================================================== */
const _p = new V3(), _q = new Q4(), _q2 = new Q4(), _sc = new V3(), _bm = new M4(), _m = new M4(), _z = new V3();
const mk = (px, py, pz, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) =>
  new M4().compose(new V3(px, py, pz), new Q4().setFromEuler(new THREE.Euler(rx, ry, rz)), new V3(sx, sy, sz));
const BOX = new THREE.BoxGeometry(1, 1, 1), CYL = new THREE.CylinderGeometry(0.5, 0.5, 1, 8), CYL6 = new THREE.CylinderGeometry(0.5, 0.5, 1, 6),
  CONE = new THREE.ConeGeometry(0.5, 1, 8), SPH = new THREE.SphereGeometry(0.5, 8, 6), ICO = new THREE.IcosahedronGeometry(0.5, 0), PLANE = new THREE.PlaneGeometry(1, 1);

// merge a list of {g, m, c} into one vertex-coloured BufferGeometry
function partsGeo(parts) {
  const pos = [], nor = [], col = [], idx = []; let base = 0;
  for (const p of parts) {
    const g = p.g.clone(); g.applyMatrix4(p.m || new M4());
    const pa = g.attributes.position, na = g.attributes.normal, c = new C(p.c || '#ffffff');
    for (let i = 0; i < pa.count; i++) { pos.push(pa.getX(i), pa.getY(i), pa.getZ(i)); nor.push(na.getX(i), na.getY(i), na.getZ(i)); col.push(c.r, c.g, c.b); }
    if (g.index) for (let i = 0; i < g.index.count; i++) idx.push(g.index.getX(i) + base);
    else for (let i = 0; i < pa.count; i++) idx.push(base + i);
    base += pa.count;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); return g;
}

// matrix for a prop placed relative to the track frame: basis (R, U, -T), then yaw about local Y.
// yaw: 0 = faces along T... local +Z = -T, so yaw PI faces the direction of travel;

  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindHold('tL', 'left'); bindHold('tR', 'right'); bindHold('tG', 'up'); bindHold('tB', 'brake');
$('bCam').addEventListener('pointerdown', e => { e.preventDefault(); toggleCam(); });
$('bQ').addEventListener('pointerdown', e => { e.preventDefault(); cycleQuality(true); });
$('bSnd').addEventListener('pointerdown', e => { e.preventDefault(); toggleSound(); });
$('title').addEventListener('pointerdown', () => { if (state.phase === 'title' && state.ready) startRace(); });

const audio = { ctx: null, on: true };
function initAudio() {
  if (audio.ctx) return; try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)(); audio.ctx = ctx;
    const mk2 = (type, g) => { const o = ctx.createOscillator(); o.type = type; const gn = ctx.createGain(); gn.gain.value = g; const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; o.connect(f); f.connect(gn); gn.connect(ctx.destination); o.start(); return { o, gn, f }; };
    audio.e1 = mk2('sawtooth', .035); audio.e2 = mk2('square', .02);

}
function toggleSound() { audio.on = !audio.on; $('bSnd').textContent = audio.on ? 'SOUND' : 'MUTED'; if (audio.ctx) { audio.on ? audio.ctx.resume() : audio.ctx.suspend(); } }
function updateAudio() {
  if (!audio.ctx || !audio.on) return; const f = 55 + car.v * 3.4 + (keys.up ? 12 : 0), t = audio.ctx.currentTime;
  audio.e1.o.frequency.setTargetAtTime(f, t, .05); audio.e2.o.frequency.setTargetAtTime(f * 1.5, t, .05);
  audio.e1.f.frequency.setTargetAtTime(500 + car.v * 18, t, .1);
}

/* ===================================================================
   10. physics + lap logic
   =================================================================== */
const car = { s: TRK.sLine - 40, d: 0, v: 0, vl: 0, ang: 0, steer: 0, boost: 0, shake: 0, wallHit: 0 };
const state = { phase: 'title', ready: false, clock: 0, countdown: 3.6, camMode: 'chase' };
const lap = { n: 0, active: false, start: 0, best: null, last: null, rec: [], ghost: null, prevU: null, maxU: 0, flash: 0 };
let inPit = false;
function resetCar() { Object.assign(car, { s: TRK.sLine - 40, d: 0, v: 0, vl: 0, ang: 0, steer: 0, boost: 0, shake: 0 }); lap.prevU = ((car.s - TRK.sLine) % L + L) % L; lap.active = false; lap.n = 0; lap.rec = []; lap.maxU = 0; state.clock = 0; lap.start = 0; }
function resetRace() { resetCar(); state.phase = 'countdown'; state.countdown = 3.6; $('center').textContent = ''; initCam(true); }
function startRace() { if (!state.ready) return; initAudio(); $('title').style.display = 'none'; resetRace(); }

function crossLine(overshoot) {
  const tCross = state.clock - overshoot;
  if (lap.active && lap.maxU > L * .9) {
    const t = tCross - lap.start; lap.last = t;
    if (lap.best == null || t < lap.best) { lap.best = t; lap.ghost = lap.rec.slice(); flashMsg('NEW BEST ' + fmt(t), 2.2); }
    else flashMsg(fmt(t), 1.6);

  lap.active = true; lap.n++; lap.start = tCross; lap.rec = []; lap.maxU = 0;
}
let flashT = 0; function flashMsg(t, dur) { const c = $('center'); c.textContent = t; c.className = 'small'; flashT = dur; }

function step(dt) {
  const C0 = CONFIG.car;
  const racing = state.phase === 'race';
  const thr = racing && keys.up ? 1 : 0, brk = racing && keys.brake ? 1 : 0, str = racing ? ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) : 0;
  car.steer += (str - car.steer) * Math.min(1, dt * 9);
  frameAt(car.s, _fr);
  const inLoop = _fr.i >= TRK.iA - 3 && _fr.i <= TRK.iB + 3;
  // longitudinal
  const vmax = C0.maxSpeed;
  let a = 0;
  if (thr) a += C0.accel * (1 - clamp(car.v / vmax, 0, 1) ** 1.6);
  a -= C0.coastDrag * .3 + car.v * (thr ? .02 : .06);

  if (inLoop && car.v < CONFIG.loop.minSpeed) car.v += (CONFIG.loop.minSpeed - car.v) * Math.min(1, dt * 4);
  // lateral: steer force, corner push, damping (the "slight drift")
  const grip = C0.grip * (brk ? .55 : 1) * (inLoop ? 1.5 : 1);
  const authority = clamp(car.v / 14, 0, 1);
  let vl = car.vl + (car.steer * C0.steerForce * authority - _fr.K * car.v * car.v * C0.cornerPush) * dt;
  vl -= vl * grip * dt; car.vl = vl;
  car.s += car.v * dt / Math.max(.5, 1 - _fr.K * car.d);
  car.d += car.vl * dt;
  // soft walls (the right wall opens up into the pit lane)
  const limL = -(hw - 1.3), limR = hw + _fr.pit - 1.3;
  car.wallHit = Math.max(0, car.wallHit - dt);
  if (car.d > limR || car.d < limL) {

    if ((right && car.vl > 0) || (!right && car.vl < 0)) { if (Math.abs(car.vl) > 3 && car.wallHit <= 0) { car.shake = Math.min(1, Math.abs(car.vl) / 10); car.wallHit = .25; } car.vl *= -.25; }
    car.v = Math.max(0, car.v * (1 - 1.1 * dt));
  }
  car.ang = lerp(car.ang, Math.atan2(car.vl, Math.max(car.v, 6)) * .9 + car.steer * .16, Math.min(1, dt * 10));
  car.shake = Math.max(0, car.shake - dt * 2.5);
  // boost pads
  const sm = ((car.s % L) + L) % L;
  if (racing) for (const pd of TRK.pads) if (sm > pd.s0 && sm < pd.s1) car.boost = 1.1;
  // pit lane hooks
  const nowPit = _fr.pit > 3 && car.d > hw - 1;
  if (nowPit !== inPit) { inPit = nowPit; (inPit ? HOOKS.onPitEnter : HOOKS.onPitExit).forEach(f => f(car, lap)); }
  // lap crossing
  const u = (((car.s - TRK.sLine) % L) + L) % L;
  if (racing) {
    if (lap.prevU != null && lap.prevU > L * .75 && u < L * .25) crossLine(u / Math.max(car.v, 1));
    lap.maxU = Math.max(lap.maxU, u);
    if (lap.active) { const target = Math.floor((state.clock - lap.start) * 30); while (lap.rec.length / 3 <= target) lap.rec.push(u, car.d, car.ang); }
  }
  lap.prevU = u;
}

/* ===================================================================
   11. cameras + HUD + main loop
   =================================================================== */
const cam = { pos: new V3(), up: new V3(0, 1, 0), look: new V3(), shot: 0, shotT: 0, shotPos: new V3(), fov: 62, shakeV: new V3() };
const _cr = { P: new V3(), T: new V3(), U: new V3(), R: new V3(), K: 0, i: 0, pit: 0 }, _tmp = new V3(), _tmp2 = new V3(), _fr2 = { P: new V3(), T: new V3(), U: new V3(), R: new V3(), K: 0, i: 0, pit: 0 };
function toggleCam() { state.camMode = state.camMode === 'chase' ? 'cine' : 'chase'; cam.shotT = 0; cam.shot = 0; }
function initCam(snap) { frameAt(car.s, _cr); cam.pos.copy(_cr.P).addScaledVector(_cr.T, -9).addScaledVector(_cr.U, 3.4); cam.up.copy(_cr.U); cam.look.copy(_cr.P); }
function updateCamera(dt) {
  frameAt(car.s, _cr);
  const carPos = carRig.group.position, kF = 1 - Math.exp(-dt * 7);
  cam.up.lerp(_cr.U, 1 - Math.exp(-dt * 4)).normalize();
  let targetFov = 62 + (car.v / CONFIG.car.maxSpeed) * 12 + (car.boost > 0 ? 9 : 0), pos = cam.pos;
  if (state.camMode === 'chase') {
    const dist = 8.2 + car.v * .03, hgt = 3.1;
    _tmp.copy(carPos).addScaledVector(_cr.T, -dist).addScaledVector(cam.up, hgt).addScaledVector(_cr.R, -car.ang * 1.5 - car.d * .08);
    pos.lerp(_tmp, 1 - Math.exp(-dt * 9));
    _tmp2.copy(carPos).addScaledVector(_cr.T, 11).addScaledVector(cam.up, 1.1);
    cam.look.lerp(_tmp2, kF * 1.1);
  } else {
    cam.shotT -= dt;
    if (cam.shotT <= 0) {   // cut to the next shot
      cam.shot = (cam.shot + 1) % 5; cam.shotT = 3.6 + RNG() * 1.8; const side = RNG() < .5 ? -1 : 1;
      if (cam.shot === 0) { frameAt(car.s + 70 + car.v, _fr2); cam.shotPos.copy(_fr2.P).addScaledVector(_fr2.R, side * 15).addScaledVector(_fr2.U, 2.2); }
      if (cam.shot === 2) { frameAt(car.s + 130 + car.v * 1.5, _fr2); cam.shotPos.copy(_fr2.P).addScaledVector(_fr2.R, side * 20).addScaledVector(_fr2.U, 15); }
      if (cam.shot === 4) { frameAt(car.s + 45 + car.v * .6, _fr2); cam.shotPos.copy(_fr2.P).addScaledVector(_fr2.R, side * 11).addScaledVector(_fr2.U, .9); }
      cam.fovShot = [44, 56, 38, 60, 36][cam.shot];
    }
    if (cam.shot === 0 || cam.shot === 2 || cam.shot === 4) pos.lerp(cam.shotPos, 1 - Math.exp(-dt * 20));
    else if (cam.shot === 1) pos.lerp(_tmp.copy(carPos).addScaledVector(_cr.T, -2.5).addScaledVector(_cr.R, 5.5).addScaledVector(_cr.U, 1.2), 1 - Math.exp(-dt * 6));   // side-on chase
    else pos.lerp(_tmp.copy(carPos).addScaledVector(_cr.T, 20).addScaledVector(_cr.R, -3).addScaledVector(_cr.U, 1.4), 1 - Math.exp(-dt * 6));          // low front
    cam.look.lerp(_tmp2.copy(carPos).addScaledVector(_cr.U, .8), 1 - Math.exp(-dt * 10));
    targetFov = cam.fovShot + (car.boost > 0 ? 6 : 0);
  }
  cam.fov += (targetFov - cam.fov) * Math.min(1, dt * 4);
  camera.position.copy(pos);
  if (car.shake > 0) { const sh = car.shake * .45 * Q.shake; camera.position.x += (Math.random() - .5) * sh; camera.position.y += (Math.random() - .5) * sh; camera.position.z += (Math.random() - .5) * sh; }
  camera.up.copy(cam.up); camera.lookAt(cam.look);
  if (Math.abs(camera.fov - cam.fov) > .05) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }
}

// zone mood
const fogTarget = new C('#35154f'), fogCur = new C('#35154f'), zoneCols = CONFIG.zones.map(z => new C(z.fog));
function updateMood(dt) {
  const z = zoneAtS(car.s); fogTarget.copy(zoneCols[z]); fogCur.lerp(fogTarget, 1 - Math.exp(-dt * 1.2));
  scene.fog.color.copy(fogCur); skyMat.uniforms.cHor.value.copy(fogCur);
  skyMat.uniforms.cMid.value.copy(fogCur).multiplyScalar(.75); skyMat.uniforms.cTop.value.copy(fogCur).multiplyScalar(.12);
}

// minimap
const mini = { c: $('mini'), g: $('mini').getContext('2d'), bg: null, minX: 1e9, maxX: -1e9, minZ: 1e9, maxZ: -1e9 };
function buildMini() {
  for (let i = 0; i < N; i++) { const p = TRK.P[i]; mini.minX = Math.min(mini.minX, p.x); mini.maxX = Math.max(mini.maxX, p.x); mini.minZ = Math.min(mini.minZ, p.z); mini.maxZ = Math.max(mini.maxZ, p.z); }
  const w = 256, pad = 22, sc = Math.min((w - pad * 2) / (mini.maxX - mini.minX), (w - pad * 2) / (mini.maxZ - mini.minZ));
  mini.sc = sc; mini.ox = (w - (mini.maxX - mini.minX) * sc) / 2; mini.oz = (w - (mini.maxZ - mini.minZ) * sc) / 2;
  const c = document.createElement('canvas'); c.width = c.height = w; const g = c.getContext('2d');
  g.fillStyle = 'rgba(15,6,40,.55)'; g.beginPath(); g.arc(w / 2, w / 2, w / 2 - 2, 0, 7); g.fill();
  g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let z = 0; z < 3; z++) { g.strokeStyle = CONFIG.zones[z].neon; g.beginPath(); let pen = false;
    for (let i = 0; i <= N; i += 3) { const ii = i % N; if (TRK.zoneOf(ii) !== z) { pen = false; continue; } const x = mini.ox + (TRK.P[ii].x - mini.minX) * mini.sc, y = mini.oz + (TRK.P[ii].z - mini.minZ) * mini.sc; pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; } g.stroke(); }
  const lp = TRK.P[TRK.iLine]; g.fillStyle = '#fff'; g.fillRect(mini.ox + (lp.x - mini.minX) * mini.sc - 4, mini.oz + (lp.z - mini.minZ) * mini.sc - 4, 8, 8);
  mini.bg = c;
}
buildMini();
function drawMini() {
  const g = mini.g; g.clearRect(0, 0, 256, 256); g.drawImage(mini.bg, 0, 0);
  const dot = (s, col, r) => { frameAt(s, _fr2); g.fillStyle = col; g.beginPath(); g.arc(mini.ox + (_fr2.P.x - mini.minX) * mini.sc, mini.oz + (_fr2.P.z - mini.minZ) * mini.sc, r, 0, 7); g.fill(); };
  if (ghostGroup.visible) dot(ghostS, '#66f6ff', 7); dot(car.s, '#ffe14a', 9);
}

// quality
function applyQuality(name) {
  QNAME = name; Q = CONFIG.quality[name];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.pr));
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  scene.fog.density = Q.fog;
  for (const m of densityMeshes) { if (m.isInstancedMesh) m.count = Math.max(1, Math.floor(m.userData.full * Q.density)); else if (m.userData.points) m.geometry.setDrawRange(0, Math.floor(m.userData.points * Q.density)); }
  if (carRig.spot) carRig.spot.visible = Q.spot; dynamic.volcanoLight.visible = Q.lights;
  dynamic.stars.geometry.setDrawRange(0, Q.stars);
  $('bQ').textContent = 'Q: ' + name.toUpperCase();
  // lights toggling changes shader programs
  scene.traverse(o => { if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => m.needsUpdate = true); } });
}
function cycleQuality(manual) { const order = ['low', 'med', 'high']; if (manual) autoQuality = false; applyQuality(order[(order.indexOf(QNAME) + 1) % 3]); }
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// main loop
let ghostS = 0, acc = 0, lastT = 0, seaT = 0, fpsAcc = 0, fpsN = 0, lowT = 0, hudT = 0, miniT = 0;
const smokeCol = new C();
function frame(now) {
  requestAnimationFrame(frame);
  now *= .001; let dt = Math.min(.05, now - lastT); lastT = now; if (dt <= 0) return;
  if (state.phase === 'countdown') {
    state.countdown -= dt; const c = state.countdown, el = $('center');
    if (c > 0) { const n = Math.ceil(c - .6); el.className = ''; el.textContent = n > 0 ? n : ''; dynamic.startLights.forEach((m, i) => m.color.setHex(i < 3 - n + 1 && n > 0 ? 0xff2020 : 0x330000)); }
    else { state.phase = 'race'; el.className = ''; el.textContent = 'GO!'; flashT = .9; dynamic.startLights.forEach(m => m.color.setHex(0x22ff55)); }
  }
  if (state.phase !== 'title') {
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n++ < 5) { step(1 / 60); if (state.phase === 'race') state.clock += 1 / 60; acc -= 1 / 60; }
    if (n >= 5) acc = 0;
  } else { acc = 0; }
  if (flashT > 0) { flashT -= dt; if (flashT <= 0) $('center').textContent = ''; }
  // car + ghost
  placeCar(carRig.group, car.s, car.d, car.ang, -car.steer * .05 * clamp(car.v / 40, 0, 1));
  if (lap.ghost && lap.active && state.phase === 'race') {
    const g = lap.ghost, tg = (state.clock - lap.start) * 30, i = Math.floor(tg), f = tg - i, len = g.length / 3;
    if (i + 1 < len) { const a = i * 3, b = a + 3; const u = lerp(g[a], g[b], f); ghostS = TRK.sLine + u; placeCar(ghostGroup, ghostS, lerp(g[a + 1], g[b + 1], f), lerp(g[a + 2], g[b + 2], f), 0); ghostGroup.visible = true; } else ghostGroup.visible = false;
  } else ghostGroup.visible = false;
  updateCamera(dt); updateMood(dt);
  // sky follows camera
  skyGroup.position.copy(camera.position);
  // dynamics
  if (Q.waves && dynamic.sea) { seaT += dt; const a = dynamic.sea.mesh.geometry.attributes.position, b = dynamic.sea.base;
    for (let i = 0; i < a.count; i++) { const x = b[i * 3], z = b[i * 3 + 2]; a.setY(i, Math.sin(x * .021 + seaT * .9) * .35 + Math.cos(z * .027 + seaT * .7) * .3); } a.needsUpdate = true; }
  dynamic.lava.material.color.setHSL(.06 + .01 * Math.sin(now * 3), 1, .55 + .08 * Math.sin(now * 5));
  { const dcam = camera.position.distanceTo(dynamic.glow.position); dynamic.glow.material.opacity = lerp(.12, .65, sstep(300, 1500, dcam)) * (.85 + .15 * Math.sin(now * 1.7)); }
  { const sm = dynamic.smoke, n = Math.min(sm.n, Q.smoke); sm.pts.geometry.setDrawRange(0, n);
    for (let i = 0; i < sm.n; i++) { sm.life[i] += dt * .045; if (sm.life[i] > 1) sm.life[i] -= 1; const l = sm.life[i], ang = i * 2.4;
      sm.pos[i * 3] = VOLC.x + Math.cos(ang) * (20 + l * 40) + l * l * 260; sm.pos[i * 3 + 1] = sm.y0 + 10 + l * 420; sm.pos[i * 3 + 2] = VOLC.z + Math.sin(ang) * (20 + l * 40) - l * 60;
      smokeCol.setRGB(lerp(1, .22, Math.min(1, l * 2.2)), lerp(.42, .15, Math.min(1, l * 2.2)), lerp(.1, .3, Math.min(1, l * 2.2))).multiplyScalar(1 - sstep(.75, 1, l)); sm.col[i * 3] = smokeCol.r; sm.col[i * 3 + 1] = smokeCol.g; sm.col[i * 3 + 2] = smokeCol.b; }
    sm.pts.geometry.attributes.position.needsUpdate = true; sm.pts.geometry.attributes.color.needsUpdate = true; }
  if (dynamic.train.length) { const [a, b] = dynamic.trainRange, span = b - a, base = a + ((now * 24) % span);
    dynamic.train.forEach((m, k) => { const s = base - k * 15.5; if (s < a) { m.visible = false; return; } m.visible = true; frameAt(s, _fr2);
      _tmp.copy(_fr2.P).addScaledVector(_fr2.R, -12.4).addScaledVector(_fr2.U, 15.2); m.position.copy(_tmp); _zb.copy(_fr2.T).negate(); _bmat.makeBasis(_fr2.R, _fr2.U, _zb); m.quaternion.setFromRotationMatrix(_bmat); }); }
  if (dynamic.wheel) { dynamic.wheel.rotation.z += dt * .12; for (const g of dynamic.gondolas) g.rotation.z = -dynamic.wheel.rotation.z; }
  HOOKS.onFrame.forEach(f => f(dt));
  updateAudio();
  // HUD
  hudT += dt; if (hudT > .04) { hudT = 0;
    $('kmh').textContent = Math.round(car.v * 3.6);
    $('lap').textContent = lap.n ? 'LAP ' + lap.n : 'LAP –';
    $('time').textContent = lap.active ? fmt(state.clock - lap.start) : '0:00.000';
    $('best').textContent = 'BEST ' + fmt(lap.best); $('last').textContent = 'LAST ' + fmt(lap.last); }
  miniT += dt; if (miniT > .06) { miniT = 0; drawMini(); }
  renderer.render(scene, camera);
  // auto quality: step down if we are consistently slow
  fpsAcc += dt; fpsN++; if (fpsAcc > 2.5) { const avg = fpsAcc / fpsN; fpsAcc = 0; fpsN = 0;
    if (autoQuality && state.phase !== 'title' && avg > 1 / 30 && QNAME !== 'low') { lowT++; if (lowT >= 2) { lowT = 0; applyQuality(QNAME === 'high' ? 'med' : 'low'); } } else lowT = 0; }
}

// boot
resetCar(); initCam(true); applyQuality(QNAME);
state.ready = true; $('goText').textContent = isTouch ? 'TAP TO RACE' : 'PRESS ANY KEY TO RACE';
requestAnimationFrame(t => { lastT = t * .001; requestAnimationFrame(frame); });

// small public API for later versions / debugging
window.CGP = { CONFIG, FEATURES, HOOKS, ANCHORS, TRK, car, lap, state, scene, camera, renderer, frameAt, applyQuality,
  rebuildCar() { buildCarMeshes(); ghostGroup.children[0].geometry = buildCarGeo(); },
  teleport(s, d = 0) { car.s = s; car.d = d; car.vl = 0; initCam(true); },
  startNow: startRace };
})();
</script>
